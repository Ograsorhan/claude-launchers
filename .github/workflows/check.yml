name: Windows package checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 package and launcher tests
        shell: powershell
        run: ./tests/Test-Package.ps1
      - name: Installer plan (no installation)
        shell: powershell
        run: ./Kur.ps1 -Plan
      - name: Build downloadable package
        shell: powershell
        run: ./Build-Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Launchers-Windows
          path: dist/*
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        shell: powershell
        run: ./Build-Package.ps1
      - name: Publish Windows installer package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.0 dist/Claude-Launchers-Windows.zip dist/Claude-Launchers-Windows.zip.sha256 --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v0.2.0 dist/Claude-Launchers-Windows.zip dist/Claude-Launchers-Windows.zip.sha256 --target "$env:GITHUB_SHA" --title "Windows kurulumu v0.2.0" --notes-file RELEASE-NOTES.md --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
